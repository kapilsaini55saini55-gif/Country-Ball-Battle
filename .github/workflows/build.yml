name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - run: |
          unzip -q CountryBallBattle_APK_Project.zip
          cd CountryBallBattle_APK
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CountryBallBattle-APK
          path: CountryBallBattle_APK/app/build/outputs/apk/debug/app-debug.apk
